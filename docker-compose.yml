services:
  script-agent:
    build: ./
    container_name: script-agent
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe HF_HOME del .env: dentro del contenedor SIEMPRE debe ser esta ruta Linux,
      # sin importar la ruta de Windows que definas en .env para el venv local.
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${MODELS_PATH}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
